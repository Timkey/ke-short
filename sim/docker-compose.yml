# ─────────────────────────────────────────────────────────────────────────────
# Synthetic Sovereign Hedge — Simulation Stack
#
# The engine runs inside Docker (no host installs needed) and writes
# dashboard/data/bundle.js — all simulation datasets embedded as JS globals.
# The dashboard is a single index.html that works on:
#   • file://  (open locally, no server required)
#   • GitHub Pages / any static host
#
# Usage:
#   docker compose run --rm engine        # regenerate datasets → bundle.js
#   open sim/dashboard/index.html         # view locally
#   git push → GitHub Pages serves it    # deploy
# ─────────────────────────────────────────────────────────────────────────────

services:

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: spv-engine
    # Mount dashboard/data directly so bundle.js lands next to index.html
    volumes:
      - ./dashboard/data:/data
    restart: "no"
